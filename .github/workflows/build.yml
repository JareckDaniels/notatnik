name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Jave 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ustaw Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Wygeneruj swiezy szkielet Androida
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name notatki .

      - name: Wgraj nasz app/build.gradle.kts (ze stalym kluczem)
        run: |
          cp szablony/app_build.gradle.kts android/app/build.gradle.kts

      - name: Ustaw nazwe aplikacji
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Notatki"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Odtworz klucz podpisujacy
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/notatki-release.jks
          cat > android/key.properties << PROPS
          storeFile=notatki-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Pobierz pakiety
        run: flutter pub get

      - name: Zbuduj APK
        run: flutter build apk --release

      - name: Wgraj APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: notatki-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
