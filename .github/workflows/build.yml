name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Jave 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ustaw Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Wygeneruj swiezy szkielet Androida
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name notatki .

      - name: Wgraj nasz app/build.gradle.kts (ze stalym kluczem)
        run: |
          # Nasz plik .kts zastepuje wygenerowany. Usuwamy stary .gradle (Groovy),
          # bo gdy oba istnieja, Gradle ignoruje .kts.
          cp szablony/app_build.gradle.kts android/app/build.gradle.kts
          rm -f android/app/build.gradle

      - name: Podbij wersje Kotlina i Android Gradle Plugin
        run: |
          # Ustawiamy komplet zgodnych wersji: AGP 8.3.0 + Kotlin 2.1.0.
          # (domyslne wygenerowane wersje sa za stare i wzajemnie niezgodne)
          for f in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/org.jetbrains.kotlin.android") version "[^"]*"/org.jetbrains.kotlin.android") version "2.1.0"/' "$f"
              sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.1.0"/' "$f"
              sed -i 's/com.android.application") version "[^"]*"/com.android.application") version "8.3.0"/' "$f"
              sed -i 's/com.android.application" version "[^"]*"/com.android.application" version "8.3.0"/' "$f"
              echo "--- $f po zmianie ---"
              grep -E "kotlin|android.application" "$f" || true
            fi
          done
          # Gradle wrapper musi byc na tyle nowy, by obsluzyc AGP 8.3
          for w in android/gradle/wrapper/gradle-wrapper.properties; do
            if [ -f "$w" ]; then
              sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.4-all.zip#' "$w"
              sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.4-bin.zip#' "$w"
              echo "--- wrapper ---"; grep distributionUrl "$w"
            fi
          done

      - name: Ustaw nazwe aplikacji
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Notatki"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Odtworz klucz podpisujacy
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/notatki-release.jks
          cat > android/key.properties << PROPS
          storeFile=notatki-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Pobierz pakiety
        run: flutter pub get

      - name: Zbuduj APK
        run: flutter build apk --release

      - name: Wgraj APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: notatki-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
